name: CI
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  JAVA_DISTRO: temurin

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          MATRIX_JSON='{
            "include": [
              {"os": "ubuntu-24.04", "arch": "x86_64", "platform": "linux/amd64", "artifact_name": "debian-amd64"},
              {"os": "ubuntu-24.04-arm", "arch": "arm64", "platform": "linux/arm64", "artifact_name": "debian-arm64"},
              {"os": "ubuntu-24.04", "arch": "armv7l", "platform": "linux/arm/v7", "artifact_name": "debian-armv7l"},
              {"os": "macos-14", "arch": "amd64", "artifact_name": "macos-amd64"},
              {"os": "macos-14", "arch": "arm64", "artifact_name": "macos-arm64"},
              {"os": "windows-latest", "arch": "x86_64", "artifact_name": "win-amd64"}
            ]
          }'
          echo "matrix=$(echo $MATRIX_JSON | jq -c .)" >> $GITHUB_OUTPUT

  build-lib:
    name: Build Library (${{ matrix.artifact_name }})
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      # --- Checkout and Setup ---
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
      # --- Linux Build Logic ---
      - name: Docker Setup Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v4
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target export \
            --output type=local,dest=dist \
            .
      # --- macOS Build Logic ---
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            arch -x86_64 ./build_macos.sh x86_64
          else
            ./build_macos.sh ${{ matrix.arch }}
          fi
          mkdir -p dist
          mv src/main/resources/macos-${{ matrix.arch }}/*.dylib dist/
      # --- Windows Build Logic ---
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop' # Forces exit on error
          .\build_win.cmd
          if (!(Test-Path dist)) { mkdir dist }
          move-item src\main\resources\win-amd64\*.dll .\dist\
      # --- Upload Artifacts ---
      - name: Upload Library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  build-maven:
    name: Maven Build
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@v8
      - name: Setup resources
        run: |
          mkdir -p src/main/resources/debian-amd64 src/main/resources/debian-arm64 src/main/resources/debian-armv7l src/main/resources/macos-amd64 src/main/resources/macos-arm64 src/main/resources/win-amd64
          cp ./debian-amd64/*.so ./src/main/resources/debian-amd64/
          cp ./debian-arm64/*.so ./src/main/resources/debian-arm64/
          cp ./debian-armv7l/*.so ./src/main/resources/debian-armv7l/
          cp ./macos-amd64/*.dylib ./src/main/resources/macos-amd64/
          cp ./macos-arm64/*.dylib ./src/main/resources/macos-arm64/
          cp ./win-amd64/*.dll ./src/main/resources/win-amd64/
      - name: Bundle resources as tarball
        run: |
          mkdir -p dist
          tar -cvf dist/resources.tar -C ./src/main/resources/ .
      - name: Upload resources tarball
        uses: actions/upload-artifact@v7
        with:
          name: libfvad-jni-resources
          path: dist/resources.tar
      - name: Build with Maven
        run: ./mvnw -B package -DskipTests -Dmaven.javadoc.skip=true -Dsource.skip=true
      - name: Bundle JAR as tarball
        run: |
          mkdir -p dist/target
          cp target/libfvad-jni-*.jar dist/target/
          rm -f dist/target/libfvad-jni-*-sources.jar || true
          tar -cvf dist/jar.tar -C dist/target/ .
      - name: Upload JAR tarball
        uses: actions/upload-artifact@v7
        with:
          name: libfvad-jni
          path: dist/jar.tar
      - name: Run spotless and license check
        run: |
          ./mvnw -B validate
          ./mvnw -B spotless:check
      - name: Run tests
        run: ./mvnw -B test

  test-maven:
    name: Maven Test (${{ matrix.artifact_name }})
    needs: [setup-matrix, build-maven]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: libfvad-jni-resources
          path: dist/
      - name: Extract resources tarball
        shell: bash
        run: |
          mkdir -p src/main/resources
          tar -xvf dist/resources.tar -C ./src/main/resources/
      - name: Run Maven Tests
        shell: bash
        run: |
          COMMON_OPTS="-B -DforkCount=0"
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "amd64" ]]; then
            echo "Running tests via Rosetta for x86_64"
            arch -x86_64 ./mvnw $COMMON_OPTS test
          else
            ./mvnw $COMMON_OPTS test
          fi

  deploy:
    name: Deploy to Maven Central
    if: github.repository == 'jvoice-project/libfvad-jni' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-maven, test-maven]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - uses: actions/download-artifact@v8
        with:
          name: libfvad-jni-resources
          path: dist/
      - name: Extract resources tarball
        shell: bash
        run: |
          mkdir -p src/main/resources
          tar -xvf dist/resources.tar -C ./src/main/resources/
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy with Maven
        id: deploy
        run: |
          ./mvnw -B clean deploy -DskipTests -Psign
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          LIBFVAD_VERSION=$(echo "${VERSION%%"-"*}")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "LIBFVAD_VERSION=$LIBFVAD_VERSION" >> $GITHUB_OUTPUT
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Release
        uses: softprops/action-gh-release@v2
        id: create_release
        with:
          name: libfvadjni v${{ steps.deploy.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: A JNI wrapper over [libfvad](https://github.com/dpirch/libfvad) v${{ steps.deploy.outputs.LIBFVAD_VERSION }}
          files: |
            target/libfvad-jni-${{ steps.deploy.outputs.VERSION }}.jar
        env:
          GITHUB_TOKEN: ${{ github.token }}
